version: "3.8"

services:
  tts-server:
    profiles:
      - local-tts
      - tts
    build:
      context: .
      dockerfile: deployment/Dockerfile.tts
    container_name: dat-tts-server
    restart: unless-stopped
    ports:
      - "13300:13300"
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    environment:
      - TTS_HOST=0.0.0.0
      - TTS_PORT=13300
      - TTS_API_KEY=${TTS_API_KEY:-}
    networks:
      dat-network:
        aliases:
          - tts-server
          - dat-tts-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  discord-bot:
    build:
      context: .
      dockerfile: deployment/Dockerfile.bot
    container_name: dat-discord-bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - ENABLE_LOCAL_TTS=${ENABLE_LOCAL_TTS:-false}
      - DEFAULT_TTS_MODE=${DEFAULT_TTS_MODE:-wavespeed}
      - WAVESPEED_API_KEYS=${WAVESPEED_API_KEYS:-}
      - WAVESPEED_MODEL=${WAVESPEED_MODEL:-elevenlabs/eleven-v4}
      - WAVESPEED_VOICE_ID=${WAVESPEED_VOICE_ID:-zGjIP4SZlMnY9m93k97r}
      - WAVESPEED_DEFAULT_SPEED=${WAVESPEED_DEFAULT_SPEED:-0.8}
      - WAVESPEED_WHITELIST=${WAVESPEED_WHITELIST:-peony,shiraga,misu,touru}
      - WAVESPEED_ALLOW_ALL_WHEN_LOCAL_DISABLED=${WAVESPEED_ALLOW_ALL_WHEN_LOCAL_DISABLED:-true}
      - TTS_API_URL=${TTS_API_URL:-http://tts-server:13300}
      - TTS_PORT=13300
    networks:
      - dat-network

volumes:
  hf-cache:

networks:
  dat-network:
    name: dat-network
    driver: bridge
